version: 2

project_name: bqvalid

# bqvalid uses googlesql's `native-ffi` engine exclusively. It links a prebuilt
# `libguest_ffi` C-ABI shared library that is only prebuilt for x86_64-linux and
# aarch64-darwin, and needs that sidecar shipped next to the binary. Those are the
# only supported targets: each is built on a runner of its own arch (so googlesql's
# build.rs downloads the matching prebuilt) and bundles the sidecar into the archive.
builds:
  - id: linux-nativeffi
    skip: '{{ eq .Runtime.Goos "darwin" }}'
    builder: rust
    binary: bqvalid
    targets:
      - x86_64-unknown-linux-gnu
    tool: cargo
    command: zigbuild
    flags:
      - --release
      - --features
      - native-ffi
    env:
      - BUILD_VERSION={{ .Version }}
    hooks:
      # Copy the cdylib googlesql's build.rs downloaded into OUT_DIR to a stable
      # path for the archive. A fresh CI checkout has exactly one googlesql-* dir.
      post:
        - sh -c 'cp target/x86_64-unknown-linux-gnu/release/build/googlesql-*/out/libguest_ffi.so ./libguest_ffi.so'

  - id: macos-nativeffi
    skip: '{{ ne .Runtime.Goos "darwin" }}'
    builder: rust
    binary: bqvalid
    targets:
      - aarch64-apple-darwin
    tool: cross
    command: build
    flags:
      - --release
      - --features
      - native-ffi
    env:
      - BUILD_VERSION={{ .Version }}
    hooks:
      post:
        - sh -c 'cp target/aarch64-apple-darwin/release/build/googlesql-*/out/libguest_ffi.dylib ./libguest_ffi.dylib'

# Archive naming: bqvalid-<arch>-<os>. Each archive carries libguest_ffi.{so,dylib}
# next to the binary; bqvalid's build.rs bakes an @executable_path/$ORIGIN rpath so
# it loads from there.
archives:
  - id: linux-nativeffi
    ids:
      - linux-nativeffi
    formats: [ 'tar.gz' ]
    name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}-
      {{- .Os }}
    files:
      - LICENSE
      - README.md
      - src: libguest_ffi.so
        strip_parent: true

  - id: macos-nativeffi
    ids:
      - macos-nativeffi
    formats: [ 'tar.gz' ]
    name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}-
      {{- .Os }}
    files:
      - LICENSE
      - README.md
      - src: libguest_ffi.dylib
        strip_parent: true

checksum:
  disable: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^refactor:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: hirosassa
    name: bqvalid
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
  header: |
    ## Release {{.Tag}} ({{.Date}})

    Welcome to this new release!
